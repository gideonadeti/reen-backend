services:
  api-gateway-1:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile.dev
    volumes:
      - ./.env.local:/app/apps/api-gateway/.env
  api-gateway-2:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile.dev
    volumes:
      - ./.env.local:/app/apps/api-gateway/.env
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile.dev
    volumes:
      - ./.env.local:/app/apps/auth/.env
  products:
    build:
      context: .
      dockerfile: apps/products/Dockerfile.dev
    volumes:
      - ./.env.local:/app/apps/products/.env
  cart-items:
    build:
      context: .
      dockerfile: apps/cart-items/Dockerfile.dev
    volumes:
      - ./.env.local:/app/apps/cart-items/.env
  checkout:
    build:
      context: .
      dockerfile: apps/checkout/Dockerfile.dev
    volumes:
      - ./.env.local:/app/apps/checkout/.env
  events-handler:
    build:
      context: .
      dockerfile: apps/events-handler/Dockerfile.dev
    volumes:
      - ./apps/events-handler:/app/apps/events-handler
      - ./.env.local:/app/apps/events-handler/.env
  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile.dev
    volumes:
      - ./.env.local:/app/apps/orders/.env
  mongodb:
    image: mongo:8.2.7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  rabbitmq:
    image: rabbitmq:4.3.0-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mongodb_data:
  rabbitmq_data:
